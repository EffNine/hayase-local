name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary installed
        shell: bash
        run: |
          ELECTRON_INSTALL=$(find . -path "*/electron/install.js" -not -path "*/electron-*" 2>/dev/null | head -1)
          if [ -n "$ELECTRON_INSTALL" ]; then
            echo "Running: node $ELECTRON_INSTALL"
            node "$ELECTRON_INSTALL" || true
          fi
          # Check for electron binary across platforms:
          # Linux: electron/dist/electron
          # Windows: electron/dist/electron.exe
          # macOS: electron/dist/Electron.app
          if find . -path "*/electron/dist/electron" -o -path "*/electron/dist/electron.exe" -o -path "*/electron/dist/Electron.app" 2>/dev/null | grep -q .; then
            echo "Electron binary found"
          else
            echo "Electron binary not found!"
            exit 1
          fi

      - name: Build interface
        run: pnpm --filter ./interface-master build

      - name: Build and package (${{ matrix.platform }})
        run: pnpm --filter ./electron-main build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            electron-main/dist/*.dmg
            electron-main/dist/*.zip
            electron-main/dist/*.exe
            electron-main/dist/*.deb
            electron-main/dist/*.AppImage
            electron-main/dist/*.blockmap
            electron-main/dist/*.yml
          if-no-files-found: ignore

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f | head -20

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/build-mac/*
            artifacts/build-linux/*
            artifacts/build-win/*
